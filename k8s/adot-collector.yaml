apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-collector
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::021891619778:role/journal-adot-collector-role
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adot-collector-config
  namespace: default
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 200
      batch: {}

    exporters:
      awsxray:
        region: us-east-1

      awsemf:
        region: us-east-1
        namespace: JournalAPI
        log_group_name: /aws/eks/journal-api/metrics
        log_stream_name: adot
        dimension_rollup_option: NoDimensionRollup
        resource_to_telemetry_conversion:
          enabled: true

      awscloudwatchlogs:
        region: us-east-1
        log_group_name: /aws/eks/journal-api/application
        log_stream_name: adot

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsxray]

        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsemf]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awscloudwatchlogs]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adot-collector
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adot-collector
  template:
    metadata:
      labels:
        app: adot-collector
    spec:
      serviceAccountName: adot-collector
      containers:
        - name: adot-collector
          image: 021891619778.dkr.ecr.us-east-1.amazonaws.com/journal-adot-collector:v0.48.0
          args:
            - --config=/conf/collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: adot-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: adot-collector
  namespace: default
spec:
  selector:
    app: adot-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318