name: CI/CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: journal-app
  EKS_CLUSTER_NAME: journal-eks-cluster
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: journal-api

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: journal_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: latest

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Initialize database schema
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql \
            -h localhost \
            -U ${{ secrets.DB_USER }} \
            -d journal_db \
            -f database_setup.sql
      
      - name: Run linting
        run: uv run ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/journal_db
        run: uv run pytest

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log into Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE_URI}"

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          GHCR_OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          ECR_SHA_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          ECR_LATEST_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          GHCR_LATEST_IMAGE="ghcr.io/${GHCR_OWNER}/journal-api:latest"

          docker build \
            -t "${ECR_SHA_IMAGE}" \
            -t "${ECR_LATEST_IMAGE}" \
            -t "${GHCR_LATEST_IMAGE}" \
            .

          docker push "${ECR_SHA_IMAGE}"
          docker push "${ECR_LATEST_IMAGE}"
          docker push "${GHCR_LATEST_IMAGE}"
  
  deploy:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"
          
      - name: Verify EKS access
        run: |
          kubectl auth can-i get deployments \
            --namespace "${K8S_NAMESPACE}"

          kubectl get nodes

      - name: Replace image placeholder in deployment.yaml
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          if ! grep -q "IMAGE_PLACEHOLDER" k8s/deployment.yaml; then
            echo "IMAGE_PLACEHOLDER not found in k8s/deployment.yaml"
            exit 1
          fi

          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" k8s/deployment.yaml

          echo "Deploying image:"
          grep "image:" k8s/deployment.yaml

      - name: Validate K8s manifest
        run: |
          kubectl apply --dry-run=client -f k8s/

      - name: Apply K8s manifest
        run: |
          kubectl apply -f k8s/

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/${K8S_DEPLOYMENT} \
            --namespace "${K8S_NAMESPACE}" \
            --timeout=5m